name: Controllo circolari Torricelli

on:
  schedule:
    # Esegue ogni 15 min (minuti 8,23,38,53) dalle 5:00 alle 18:59 UTC
    # (Copre circa dalle 07:00 alle 19:00/20:00 in Italia)
    - cron: "8,23,38,53 5-18 * * *"
  workflow_dispatch:

concurrency:
  group: rss-notify
  cancel-in-progress: false

jobs:
  check-rss:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Ripristina cronologia (Cache)
        uses: actions/cache/restore@v4
        with:
          path: seen.json
          key: seen-json-${{ github.run_id }}
          restore-keys: |
            seen-json-

      - name: Controlla e notifica
        env:
          NTFY_TOPIC: torricelli_circolari_8f4k29m7x5q1z6
        run: |
          python3 - <<'PY'
          import urllib.request
          import xml.etree.ElementTree as ET
          import json
          import os
          import time
          from pathlib import Path

          RSS_URL = "https://torricellimi.edu.it/feed/circolari.rss"
          TOPIC = os.environ["NTFY_TOPIC"]
          STATE_FILE = Path("seen.json")

          def download(url):
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0 RSS monitor"}
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return response.read()

          # 1. Legge il feed RSS
          rss_data = download(RSS_URL)
          root = ET.fromstring(rss_data)
          rss_items = []
          for item in root.findall(".//item"):
              title = item.findtext("title", "").strip()
              link = item.findtext("link", "").strip()
              guid = item.findtext("guid", "").strip()
              identifier = guid or link or title
              if identifier and link:
                  rss_items.append({"id": identifier, "title": title, "link": link})

          print(f"Elementi presenti nel RSS: {len(rss_items)}")

          # 2. Legge lo stato precedente dalla cache
          if STATE_FILE.exists():
              try:
                  seen = set(json.loads(STATE_FILE.read_text(encoding="utf-8")))
              except Exception:
                  seen = set()
          else:
              seen = set()

          first_run = not STATE_FILE.exists()

          # 3. Prima esecuzione in assoluto
          if first_run:
              print("Cache vuota: salvo le circolari esistenti per non spammare notifiche.")
              for item in rss_items:
                  seen.add(item["id"])
          
          # 4. Esecuzioni successive: notifica le novità
          else:
              new_items = [item for item in rss_items if item["id"] not in seen]
              if not new_items:
                  print("Nessuna nuova circolare.")
              else:
                  print(f"Trovate {len(new_items)} nuove circolari!")
                  for item in reversed(new_items):
                      try:
                          message = f'{item["title"]}\n{item["link"]}'
                          request = urllib.request.Request(
                              f"https://ntfy.sh/{TOPIC}",
                              data=message.encode("utf-8"),
                              method="POST",
                              headers={
                                  "Title": "Nuova circolare Torricelli",
                                  "Priority": "default",
                                  "Tags": "school"
                              }
                          )
                          with urllib.request.urlopen(request, timeout=30) as response:
                              if response.status != 200:
                                  raise RuntimeError(f"ntfy HTTP {response.status}")
                          seen.add(item["id"])
                          print(f'Notifica inviata: {item["title"]}')
                      except Exception as error:
                          print(f"ERRORE invio notifica per {item['link']}: {error}")
                      time.sleep(0.5)

          # Aggiorna SEMPRE il file in locale per la cache successiva
          STATE_FILE.write_text(
              json.dumps(sorted(seen), ensure_ascii=False, indent=2),
              encoding="utf-8"
          )
          PY

      - name: Salva cronologia aggiornata (Cache)
        uses: actions/cache/save@v4
        if: always()
        with:
          path: seen.json
          key: seen-json-${{ github.run_id }}
          
