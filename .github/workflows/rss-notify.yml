name: Controllo circolari Torricelli

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rss-notify
  cancel-in-progress: false

jobs:
  check-rss:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v5

      - name: Controlla RSS e invia notifiche
        env:
          NTFY_TOPIC: torricelli_circolari_8f4k29m7x5q1z6
        run: |
          python3 - <<'PY'
          import urllib.request
          import xml.etree.ElementTree as ET
          import json
          import os
          from pathlib import Path

          RSS_URL = "https://torricellimi.edu.it/feed/circolari.rss"
          TOPIC = os.environ["NTFY_TOPIC"]
          STATE_FILE = Path("seen.json")

          # Scarica il feed RSS
          request = urllib.request.Request(
              RSS_URL,
              headers={"User-Agent": "Mozilla/5.0 RSS monitor"}
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              data = response.read()

          # Mostra il contenuto originale del feed
          print("========== INIZIO FEED RSS ==========")
          print(data.decode("utf-8", errors="replace"))
          print("=========== FINE FEED RSS ===========")

          root = ET.fromstring(data)

          # Legge le pubblicazioni
          items = []

          for item in root.findall(".//item"):
              title = item.findtext("title", "").strip()
              link = item.findtext("link", "").strip()
              guid = item.findtext("guid", "").strip()

              identifier = guid or link or title

              if identifier:
                  items.append({
                      "id": identifier,
                      "title": title,
                      "link": link
                  })

          print(f"Elementi trovati nel feed: {len(items)}")

          if not items:
              print("Nessun elemento nel feed.")
              raise SystemExit(0)

          # Carica gli articoli già visti
          if STATE_FILE.exists():
              try:
                  seen = set(json.loads(STATE_FILE.read_text()))
              except Exception:
                  seen = set()
          else:
              seen = None

          # Prima esecuzione:
          # registra gli articoli esistenti senza notificare quelli vecchi.
          if seen is None:
              seen = {item["id"] for item in items}

              STATE_FILE.write_text(
                  json.dumps(
                      sorted(seen),
                      ensure_ascii=False,
                      indent=2
                  )
              )

              print(
                  f"Prima esecuzione: registrati {len(seen)} "
                  "articoli senza inviare notifiche."
              )

          else:
              new_items = [
                  item for item in items
                  if item["id"] not in seen
              ]

              if not new_items:
                  print("Nessuna nuova circolare.")

              else:
                  print(
                      f"Nuove circolari trovate: {len(new_items)}"
                  )

                  # Invia prima le più vecchie
                  for item in reversed(new_items):
                      message = (
                          f'{item["title"]}\n'
                          f'{item["link"]}'
                      )

                      request = urllib.request.Request(
                          f"https://ntfy.sh/{TOPIC}",
                          data=message.encode("utf-8"),
                          method="POST",
                          headers={
                              "Title": "Nuova circolare Torricelli",
                              "Priority": "default",
                              "Tags": "school"
                          }
                      )

                      with urllib.request.urlopen(
                          request,
                          timeout=30
                      ) as response:
                          if response.status != 200:
                              raise RuntimeError(
                                  f"ntfy ha restituito HTTP "
                                  f"{response.status}"
                              )

                      print(
                          f'Notifica inviata: {item["title"]}'
                      )

                      seen.add(item["id"])

                  # Mantieni gli ultimi 200 articoli
                  seen = set(list(seen)[-200:])

                  STATE_FILE.write_text(
                      json.dumps(
                          sorted(seen),
                          ensure_ascii=False,
                          indent=2
                      )
                  )

                  print("Stato aggiornato.")

          PY

      - name: Salva lo stato nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add seen.json

          if git diff --cached --quiet; then
            echo "Nessuna modifica allo stato."
          else
            git commit -m "Aggiorna stato RSS"
            git push
          fi
